[ppe]
# Webcam index, local video path, or RTSP URL.
# Example RTSP: rtsp://username:password@camera-ip:554/stream
source = 0

# PyTorch weights. If missing, the application downloads them at runtime.
weights = models/ppe_hansung.pt
weights_url = https://huggingface.co/Hansung-Cho/yolov8-ppe-detection/resolve/main/best.pt

device = cpu
show = true
print_raw = false
conf = 0.35
iou = 0.5
infer_every = 3
resize_w = 960
resize_h = 540

# PPE-to-person matching regions.
head_ratio = 0.40
torso_top = 0.20
torso_bottom = 0.85
person_id = -1
helmet_id = -1
vest_id = -1

# Optional MQTT output.
mqtt_enabled = false
mqtt_broker = localhost
mqtt_port = 1883
mqtt_topic = demo/PPE
mqtt_topic_ok = demo/PPE/OK
mqtt_topic_no_helmet = demo/PPE/NO_HELMET
mqtt_topic_no_vest = demo/PPE/NO_VEST
mqtt_topic_no_helmet_no_vest = demo/PPE/NO_HELMET_NO_VEST
mqtt_username =
mqtt_password =
mqtt_cooldown = 2.0
